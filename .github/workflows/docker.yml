name: Build, Test and Push Docker Image

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: static-website-cicd
  TEST_CONTAINER_NAME: static-website-test
  TEST_HOST_PORT: 8080
  CONTAINER_PORT: 80
  HEALTH_PATH: /health

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --tag "${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            .

      - name: Start test container
        run: |
          docker run --detach \
            --name "${{ env.TEST_CONTAINER_NAME }}" \
            --publish "${{ env.TEST_HOST_PORT }}:${{ env.CONTAINER_PORT }}" \
            "${{ env.IMAGE_NAME }}:${{ github.sha }}"

      - name: Wait and test health endpoint
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent \
              "http://localhost:${{ env.TEST_HOST_PORT }}${{ env.HEALTH_PATH }}"; then
              echo "Container is healthy."
              exit 0
            fi

            echo "Waiting for container: attempt ${attempt}/12"
            sleep 5
          done

          echo "Health check failed."
          exit 1

      - name: Test homepage
        run: |
          curl --fail --show-error \
            "http://localhost:${{ env.TEST_HOST_PORT }}/"

      - name: Show container logs if workflow fails
        if: failure()
        run: docker logs "${{ env.TEST_CONTAINER_NAME }}" || true

      - name: Remove test container
        if: always()
        run: docker rm --force "${{ env.TEST_CONTAINER_NAME }}" || true

  push-to-dockerhub:
    name: Push to Docker Hub
    runs-on: ubuntu-latest
    needs: build-and-test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image tags
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
